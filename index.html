<title>Word Upgrade</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one centred reading column. Header with a double rule, then a single card holding the sentence (boring word highlighted like marker pen), three stacked answer buttons, and feedback. */
:root {
  --bg: #f2f4f7;
  --surface: #ffffff;
  --surface-2: #e4e8ef;
  --ink: #1b2230;
  --ink-2: #556073;
  --line: #d0d7e2;
  --accent: #2f45c5;
  --accent-ink: #ffffff;
  --accent-soft: rgba(47, 69, 197, 0.12);
  --mark: #ffe36e;
  --mark-ink: #1b2230;
  --pen: #c92a42;
  --ok: #0f7a62;
  --ok-bg: #dcf3ec;
  --bad: #b4281f;
  --bad-bg: #fbe5e2;
  --font-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151f;
    --surface: #19212f;
    --surface-2: #242e42;
    --ink: #eaeef7;
    --ink-2: #a5b0c6;
    --line: #323e57;
    --accent: #8ea2ff;
    --accent-ink: #10151f;
    --accent-soft: rgba(142, 162, 255, 0.2);
    --mark: #6b5800;
    --mark-ink: #fff1b0;
    --pen: #ff7d90;
    --ok: #5fd6b3;
    --ok-bg: #123a30;
    --bad: #ff8f85;
    --bad-bg: #3f1d1f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151f;
  --surface: #19212f;
  --surface-2: #242e42;
  --ink: #eaeef7;
  --ink-2: #a5b0c6;
  --line: #323e57;
  --accent: #8ea2ff;
  --accent-ink: #10151f;
  --accent-soft: rgba(142, 162, 255, 0.2);
  --mark: #6b5800;
  --mark-ink: #fff1b0;
  --pen: #ff7d90;
  --ok: #5fd6b3;
  --ok-bg: #123a30;
  --bad: #ff8f85;
  --bad-bg: #3f1d1f;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
.app { max-width: 720px; margin-inline: auto; padding-block: 28px 56px; padding-inline: clamp(16px, 4vw, 32px); }

.top { padding-bottom: 18px; margin-bottom: 22px; border-bottom: 4px double var(--ink); }
.eyebrow { margin: 0 0 10px; font: 500 0.75rem/1 var(--font-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-2); }
h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(2rem, 6vw, 3rem); line-height: 1.02; letter-spacing: -0.02em; text-wrap: balance; }
.lede { margin: 10px 0 0; color: var(--ink-2); font-size: 1.05rem; }

.fieldlab { margin: 0; font: 500 0.7rem/1 var(--font-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-2); }

.qhead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; margin-bottom: 12px; font: 500 0.85rem var(--font-mono); font-variant-numeric: tabular-nums; color: var(--ink-2); }
.segs { display: flex; gap: 4px; }
.segs i { display: block; width: 22px; height: 8px; border-radius: 99px; background: var(--surface-2); }
.segs i.cur { background: var(--accent); }
.segs i.ok { background: var(--ok); }
.segs i.retry { background: var(--pen); }

.qcard { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: clamp(16px, 4vw, 30px); }
.sent { margin: 14px 0 6px; font-size: clamp(1.25rem, 4.4vw, 1.6rem); line-height: 1.6; }
mark.boring { background: var(--mark); color: var(--mark-ink); padding: 0.05em 0.3em; border-radius: 4px; font-weight: 700; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
mark.boring.up { background: transparent; padding: 0; }
mark.boring del { color: var(--pen); text-decoration: line-through; text-decoration-thickness: 2px; font-weight: 400; margin-right: 0.4em; }
mark.boring ins { color: var(--ok); text-decoration: none; font-weight: 700; border-bottom: 3px solid var(--ok); }
.hint-on .clue { background: var(--accent-soft); text-decoration: underline wavy var(--accent); text-underline-offset: 6px; text-decoration-thickness: 1.5px; border-radius: 3px; }
.link { appearance: none; background: none; border: 0; padding: 4px 0; font: 700 0.95rem var(--font-body); color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

.opts { display: grid; gap: 10px; margin-top: 18px; }
.opt { appearance: none; width: 100%; font: inherit; color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; display: flex; align-items: flex-start; gap: 12px; text-align: left; min-width: 0; transition: border-color 0.12s, background 0.12s; }
.opt:hover { border-color: var(--accent); }
.opt .k { flex: none; margin-top: 3px; font: 500 0.75rem var(--font-mono); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; color: var(--ink-2); }
.opt .body { flex: 1; min-width: 0; }
.opt b { display: block; font-size: 1.2rem; line-height: 1.3; }
.opt .note { display: block; margin-top: 4px; font-size: 0.95rem; color: var(--ink-2); }
.opt .ic { display: none; flex: none; width: 22px; height: 22px; margin-top: 2px; }
.opt.right, .opt.right:hover { border-color: var(--ok); background: var(--ok-bg); cursor: default; }
.opt.right .ic-ok { display: block; color: var(--ok); }
.opt.right .note { color: var(--ok); }
.opt.wrong, .opt.wrong:hover { border-color: var(--bad); background: var(--bad-bg); cursor: default; animation: shake 0.4s; }
.opt.wrong .ic-no { display: block; color: var(--bad); }
.opt.wrong .note { color: var(--bad); }
.opt.rest, .opt.rest:hover { cursor: default; border-style: dashed; border-color: var(--line); }
.opt.rest b { color: var(--ink-2); font-weight: 700; }
.tag { margin-bottom: 2px; font: 500 0.68rem var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; }

.status { min-height: 3em; margin: 16px 0 0; font-size: 1.05rem; }
.status.good { color: var(--ok); font-weight: 700; }
.status.bad { color: var(--bad); font-weight: 700; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
.btn { appearance: none; font: 700 1rem var(--font-body); padding: 11px 20px; border-radius: 10px; cursor: pointer; border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn:hover { filter: brightness(1.08); }
.btn:focus-visible, .opt:focus-visible, .link:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.results h2 { margin: 8px 0 4px; font: 700 clamp(1.8rem, 5vw, 2.4rem)/1.05 var(--font-display); letter-spacing: -0.01em; }
.results h2:focus { outline: none; }
.results p { margin: 0; color: var(--ink-2); }
.ups { list-style: none; margin: 22px 0 0; padding: 0; display: grid; gap: 8px; }
.up { padding: 12px 14px; background: var(--surface); border: 2px solid var(--line); border-radius: 12px; }
.up.ok { border-color: var(--ok); }
.up.miss { border-color: var(--bad); background: var(--bad-bg); }
.pair { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font-size: 1.15rem; }
.pair del { color: var(--pen); text-decoration-thickness: 2px; }
.pair b { color: var(--ok); }
.pair .arrow { color: var(--ink-2); }
.up .gloss { margin-top: 2px; color: var(--ink-2); }
.up small { display: block; margin-top: 4px; font: 500 0.68rem var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); }
.up.ok small { color: var(--ok); }
.up.miss small { color: var(--bad); }
.results .actions { margin-top: 20px; }

@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
@media (max-width: 480px) { .segs i { width: 14px; } }
</style>

<div class="app">
  <header class="top">
    <p class="eyebrow">Vocabulary · Describing people and things</p>
    <h1>Word Upgrade</h1>
    <p class="lede">Swap the boring adjective for a stronger one that fits the person or thing.</p>
  </header>
  <main id="stage"></main>
</div>

<script>
(function () {
  'use strict';

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var shuffle = function (a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  };
  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

  /* [[ ]] marks the boring adjective, { { } } marks the context clue shown by "Show a clue". */
  var ITEMS = [
    { boring: 'nice',
      text: "My cousin is really [[nice]]. She {{talks to everyone at parties and makes new friends within minutes}}.",
      opts: [
        { w: 'outgoing', ok: true, gloss: 'friendly, confident and happy to meet new people' },
        { w: 'generous', why: 'Generous means giving a lot of money, time or help. The sentence is about meeting people.' },
        { w: 'polite', why: 'Polite means having good manners. The sentence is about making friends easily, not manners.' }
      ] },
    { boring: 'kind',
      text: "My grandmother is [[kind]]. She {{looked after sick neighbours for years and never asked for anything in return}}.",
      opts: [
        { w: 'selfless', ok: true, gloss: 'caring more about other people’s needs than your own' },
        { w: 'ambitious', why: 'Ambitious means wanting to be very successful. Helping neighbours for nothing is not about success.' },
        { w: 'sensible', why: 'Sensible means making practical, careful choices. The sentence is about helping others, not making choices.' }
      ] },
    { boring: 'interesting',
      text: "Our history teacher is [[interesting]]. She {{makes every lesson so lively that students are disappointed when the bell rings}}.",
      opts: [
        { w: 'engaging', ok: true, gloss: 'holding your attention and making you want to take part' },
        { w: 'strict', why: 'Strict means making people obey the rules. The clue is about lively lessons, not rules.' },
        { w: 'forgetful', why: 'Forgetful means often unable to remember things. This has nothing to do with lively lessons.' }
      ] },
    { boring: 'horrible',
      text: "My boss is [[horrible]]. He {{ignores everyone’s ideas and says he is always right}}.",
      opts: [
        { w: 'arrogant', ok: true, gloss: 'believing you are better or more important than other people' },
        { w: 'indecisive', why: 'Indecisive means unable to make decisions. Someone who is always sure he is right is the opposite.' },
        { w: 'sympathetic', why: 'Sympathetic means showing you understand other people’s problems. He ignores people’s ideas, so he does not.' }
      ] },
    { boring: 'funny',
      text: "My best friend is [[funny]]. She {{always has a quick, clever joke ready}}, even in boring meetings.",
      opts: [
        { w: 'witty', ok: true, gloss: 'clever and quick at making amusing comments' },
        { w: 'bossy', why: 'Bossy means always telling other people what to do. It does not describe someone who makes clever jokes.' },
        { w: 'eccentric', why: 'Eccentric means unusual or strange in a harmless way. The sentence does not describe odd behaviour.' }
      ] },
    { boring: 'big',
      text: "My suitcase is [[big]]. It {{holds three weeks of clothes, two pairs of shoes and a tent}}.",
      opts: [
        { w: 'spacious', ok: true, gloss: 'with plenty of room inside' },
        { w: 'fashionable', why: 'Fashionable means popular and modern in style. The sentence is about how much it can hold.' },
        { w: 'scruffy', why: 'Scruffy means untidy and in poor condition. Nothing in the sentence is about its condition.' }
      ] },
    { boring: 'old',
      text: "My grandfather’s watch is [[old]]. It {{was made in 1890 and is worth thousands of dollars}}.",
      opts: [
        { w: 'antique', ok: true, gloss: 'old and valuable, the kind of object people collect' },
        { w: 'outdated', why: 'Outdated means no longer modern or useful. A watch worth thousands of dollars is valued, not useless.' },
        { w: 'worn-out', why: 'Worn-out means damaged by use and no longer working well. A valuable watch is not described that way.' }
      ] },
    { boring: 'good',
      text: "My backpack is [[good]]. I {{have used it every day for five years and it still looks new}}.",
      opts: [
        { w: 'durable', ok: true, gloss: 'strong and able to last a long time' },
        { w: 'stylish', why: 'Stylish means fashionable and attractive. The sentence is about how long it lasts.' },
        { w: 'lightweight', why: 'Lightweight means not heavy. Nothing in the sentence is about weight.' }
      ] },
    { boring: 'bad',
      text: "My phone is [[bad]]. It {{freezes and switches off without warning}}.",
      opts: [
        { w: 'unreliable', ok: true, gloss: 'not working well when you need it' },
        { w: 'bulky', why: 'Bulky means large and awkward to carry. The sentence is about how the phone works, not its size.' },
        { w: 'slim', why: 'Slim means thin. That describes its shape, not how well it works.' }
      ] },
    { boring: 'cheap',
      text: "This umbrella was [[cheap]]. The first strong wind {{bent the metal frame and tore the fabric}}.",
      opts: [
        { w: 'flimsy', ok: true, gloss: 'weak and badly made, so it breaks easily' },
        { w: 'colourful', why: 'Colourful means bright, with many colours. The sentence is about how strong it is.' },
        { w: 'waterproof', why: 'Waterproof means water cannot get through. The sentence is about wind damage, not water.' }
      ] }
  ];
  ITEMS.forEach(function (it) {
    it.better = it.opts.filter(function (o) { return o.ok; })[0];
  });

  function sentenceHtml(t) {
    return esc(t)
      .replace(/\[\[(.+?)\]\]/, '<mark class="boring" id="bw">$1</mark>')
      .replace(/\{\{(.+?)\}\}/, '<span class="clue">$1</span>');
  }

  var IC_OK = '<svg class="ic ic-ok" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var IC_NO = '<svg class="ic ic-no" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>';

  var stage = $('#stage');
  var G = null;

  function start(ids) {
    var list = ids && ids.length ? ids : ITEMS.map(function (_, i) { return i; });
    G = { order: shuffle(list), i: 0, res: {}, hints: 0, solved: false, tries: 0, hinted: false, opts: [] };
    renderQ();
  }

  function renderQ() {
    var idx = G.order[G.i], it = ITEMS[idx];
    G.solved = false; G.tries = 0; G.hinted = false;
    G.opts = shuffle(it.opts.map(function (_, k) { return k; }));
    var segs = G.order.map(function (id, k) {
      var cls = k < G.i ? (G.res[id] && G.res[id].tries === 0 ? 'ok' : 'retry') : (k === G.i ? 'cur' : '');
      return '<i class="' + cls + '"></i>';
    }).join('');
    stage.innerHTML =
      '<div class="qhead"><span>Sentence ' + (G.i + 1) + ' of ' + G.order.length + '</span><span class="segs" aria-hidden="true">' + segs + '</span></div>' +
      '<div class="qcard">' +
      '<p class="fieldlab">Replace the highlighted word</p>' +
      '<p class="sent" id="sent">' + sentenceHtml(it.text) + '</p>' +
      '<button class="link" id="hint" aria-pressed="false">Show a clue</button>' +
      '<div class="opts" role="group" aria-label="Choose a better adjective">' +
      G.opts.map(function (k, n) {
        return '<button class="opt" data-k="' + k + '"><span class="k">' + (n + 1) + '</span>' +
          '<span class="body"><b>' + it.opts[k].w + '</b><span class="note" hidden></span></span>' + IC_OK + IC_NO + '</button>';
      }).join('') + '</div>' +
      '<p class="status" id="status" aria-live="polite">Choose the adjective that fits the sentence.</p>' +
      '<div class="actions" id="actions"></div>' +
      '</div>';
  }

  function setStatus(text, cls) {
    var s = $('#status');
    if (!s) return;
    s.textContent = text;
    s.className = 'status' + (cls ? ' ' + cls : '');
  }

  function pick(btn) {
    if (!G || G.solved || btn.classList.contains('wrong')) return;
    var idx = G.order[G.i], it = ITEMS[idx], o = it.opts[+btn.dataset.k];
    var note = $('.note', btn);
    if (o.ok) {
      G.solved = true;
      document.querySelectorAll('.opt').forEach(function (b) {
        b.setAttribute('aria-disabled', 'true');
        var oo = it.opts[+b.dataset.k], n = $('.note', b);
        if (b === btn) {
          b.classList.add('right');
          n.textContent = 'Means: ' + oo.gloss + '.';
          n.hidden = false;
        } else if (!b.classList.contains('wrong')) {
          b.classList.add('rest');
          n.textContent = oo.why;
          n.hidden = false;
        }
      });
      var bw = $('#bw');
      bw.classList.add('up');
      bw.innerHTML = '<del>' + it.boring + '</del><ins>' + o.w + '</ins>';
      G.res[idx] = { tries: G.tries, hint: G.hinted };
      setStatus(G.tries === 0 ? 'Correct on the first try.' : 'Correct. Now you know why the others do not fit.', 'good');
      var last = G.i === G.order.length - 1;
      $('#actions').innerHTML = '<button class="btn" id="next">' + (last ? 'See my results' : 'Next sentence') + '</button>';
      var b = $('#next');
      b.onclick = function () { if (last) results(); else { G.i++; renderQ(); } };
      b.focus({ preventScroll: true });
    } else {
      G.tries++;
      btn.classList.add('wrong');
      note.textContent = o.why;
      note.hidden = false;
      setStatus('Not quite. Read the sentence again and try another word.', 'bad');
    }
  }

  function toggleHint(btn) {
    var on = $('#sent').classList.toggle('hint-on');
    btn.textContent = on ? 'Hide the clue' : 'Show a clue';
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    if (on && !G.hinted) { G.hinted = true; G.hints++; }
  }

  function results() {
    var total = G.order.length;
    var first = G.order.filter(function (id) { return G.res[id].tries === 0; }).length;
    var missed = G.order.filter(function (id) { return G.res[id].tries > 0; });
    var msg = first === total ? 'Perfect. Every upgrade on the first try.' :
      first / total >= 0.7 ? 'Good work. A few to look at again.' :
      first / total >= 0.4 ? 'Getting there. Read the explanations and try again.' :
      'Keep going. The explanations show how each word is used.';
    var hintText = G.hints ? ' You used the clue on ' + G.hints + (G.hints === 1 ? ' sentence.' : ' sentences.') : '';
    stage.innerHTML =
      '<section class="results">' +
      '<p class="fieldlab">Result</p>' +
      '<h2 id="rh" tabindex="-1">' + first + ' / ' + total + ' on the first try</h2>' +
      '<p>' + msg + hintText + '</p>' +
      '<ul class="ups">' + G.order.map(function (id) {
        var it = ITEMS[id], r = G.res[id];
        return '<li class="up ' + (r.tries === 0 ? 'ok' : 'miss') + '">' +
          '<div class="pair"><del>' + it.boring + '</del><span class="arrow" aria-label="becomes">→</span><b>' + it.better.w + '</b></div>' +
          '<div class="gloss">' + it.better.gloss + '</div>' +
          '<small>' + (r.tries === 0 ? 'First try' : r.tries + (r.tries === 1 ? ' wrong try' : ' wrong tries')) + '</small></li>';
      }).join('') + '</ul>' +
      '<div class="actions"><button class="btn" id="again">Play again</button>' +
      (missed.length ? '<button class="btn ghost" id="again-missed">Practise the ' + missed.length + ' I missed</button>' : '') +
      '</div></section>';
    $('#again').onclick = function () { start(); };
    if (missed.length) $('#again-missed').onclick = function () { start(missed); };
    $('#rh').focus({ preventScroll: true });
  }

  stage.addEventListener('click', function (e) {
    var opt = e.target.closest('.opt');
    if (opt) { pick(opt); return; }
    var h = e.target.closest('#hint');
    if (h) toggleHint(h);
  });
  document.addEventListener('keydown', function (e) {
    if (!G || G.solved || e.metaKey || e.ctrlKey || e.altKey) return;
    var n = parseInt(e.key, 10);
    if (n >= 1 && n <= 3) {
      var b = document.querySelectorAll('.opt')[n - 1];
      if (b) pick(b);
    }
  });

  start();
})();
</script>
